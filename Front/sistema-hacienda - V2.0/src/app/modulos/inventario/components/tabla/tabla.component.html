<table class="table table-hover">
    <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Stock</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        <ng-container *ngFor="let p of paginatedData; let i = index">

            <!-- FILA PRINCIPAL -->
            <tr class="row-main" (click)="toggleRow(p)" [class.active]="isExpanded(p)">

                <td>{{ p.codigo }}</td>

                <td>
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa" [ngClass]="isExpanded(p) ? 'fa-chevron-down' : 'fa-chevron-right'">
                        </i>

                        {{ p.nombre }}
                    </div>
                </td>

                <td>
                    <span [class.text-danger]="p.stock <= 5">
                        {{ p.stock }}
                    </span>
                </td>

                <td (click)="$event.stopPropagation()">
                    <button class="btn btn-sm btn-info" (click)="verKardex.emit(p)">
                        Kardex
                    </button>
                </td>
            </tr>

            <!-- FILA EXPANDIDA -->
            <tr class="row-detail" *ngIf="isExpanded(p)">
                <td colspan="4">
                    <div class="detail-box">

                        <div class="row">
                            <div class="col-md-9">
                                <strong>Descripción:</strong>
                                <p class="mb-1 text-muted">
                                    {{ p.descripcion || 'Sin descripción' }}
                                </p>
                            </div>




                        </div>

                    </div>
                </td>
            </tr>

        </ng-container>
    </tbody>

</table>

<!-- PAGINADOR -->
<div class="d-flex justify-content-between align-items-center mt-3">

    <div class="text-muted small">
        Mostrando {{ startIndex + 1 }} - {{ endIndex }} de {{ data.length }}
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="page === 1">
            ←
        </button>

        <span class="px-2 small align-self-center">
            Página {{ page }} / {{ totalPages }}
        </span>

        <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()" [disabled]="page === totalPages">
            →
        </button>
    </div>

</div>
