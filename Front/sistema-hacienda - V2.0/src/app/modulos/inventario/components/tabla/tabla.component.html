<table class="table table-hover">
    <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Stock</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        <ng-container *ngFor="let p of paginatedData; let i = index">

            <!-- FILA PRINCIPAL -->
            <tr class="row-main" (click)="toggleRow(p)" [class.active]="isExpanded(p)">

                <td>{{ p.codigo }}</td>

                <td>
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi" [ngClass]="isExpanded(p) ? 'bi-chevron-down' : 'bi-chevron-right'">
                        </i>

                        {{ p.nombre }}
                    </div>
                </td>

                <td>
                    <span class="estado-badge" [ngClass]="{
                        'completo': p.stock > 2,
                        'parcial': p.stock > 0 && p.stock <= 2,
                        'pendiente': p.stock == 0,
                        'null':p.stock == null
                    
                        }">

                        <i class="bi" [ngClass]="{
                            'bi-check-circle-fill': p.stock > 2,
                            'bi-exclamation-triangle-fill': p.stock > 0 && p.stock <= 2,
                            'bi-x-circle-fill': p.stock == 0,
                            'bi-slash-square-fill':p.stock == null
                        }"></i>

                        {{ p.stock ?? 0 }}

                    </span>
                </td>

                <td (click)="$event.stopPropagation()">

                    <div class="d-flex gap-1">

                        <button class="btn-accion" title="Kardex" (click)="verKardex.emit(p)">
                            <i class="bi bi-card-checklist"></i>
                        </button>

                        <button class="btn-accion" style="background:#10b981" title="Asignar" (click)="asignar.emit(p)">
                            <i class="bi bi-person-plus-fill"></i>
                        </button>

                    </div>

                </td>
            </tr>

            <!-- FILA EXPANDIDA -->
            <tr class="row-detail" *ngIf="isExpanded(p)">
                <td colspan="4">
                    <div class="detail-box">

                        <div class="row">
                            <div class="col-md-9">
                                <strong>Descripción:</strong>
                                <p class="mb-1 text-muted">
                                    {{ p.descripcion || 'Sin descripción' }}
                                </p>
                            </div>




                        </div>

                    </div>
                </td>
            </tr>

        </ng-container>
    </tbody>

</table>

<!-- PAGINADOR -->
<div class="d-flex justify-content-between align-items-center mt-3">

    <div class="text-muted small">
        Mostrando {{ startIndex + 1 }} - {{ endIndex }} de {{ data.length }}
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="page === 1">
            ←
        </button>

        <span class="px-2 small align-self-center">
            Página {{ page }} / {{ totalPages }}
        </span>

        <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()" [disabled]="page === totalPages">
            →
        </button>
    </div>

</div>
