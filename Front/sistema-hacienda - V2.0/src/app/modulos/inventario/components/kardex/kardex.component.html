<app-modal title="Kardex de Producto" (close)="close.emit()">

    <!-- HEADER -->
    <div class="kardex-header">

        <div>
            <h5 class="mb-0 fw-bold">
                {{ producto?.nombre }}
            </h5>

            <small class="text-muted">
                Código: <span class="fw-semibold">{{ producto?.codigo }}</span>
            </small>
        </div>

        <span class="badge-stock">
            {{ data.length || 0 }} movimientos
        </span>

    </div>

    <!-- TABLA -->
    <div class="table-responsive kardex-table">

        <table class="table table-sm align-middle">

            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th class="text-end">Cantidad</th>
                    <th class="text-end">Stock Ant.</th>
                    <th class="text-end">Stock Nuevo</th>
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let k of data" class="kardex-row">

                    <td class="text-muted">
                        {{ formatearFecha(k.fecha) }}
                    </td>

                    <td>
                        <span class="badge-kardex" [ngClass]="k.tipo.toLowerCase()">
                            {{ k.tipo }}
                        </span>
                    </td>

                    <td class="text-end fw-semibold">
                        {{ k.cantidad }}
                    </td>

                    <td class="text-end text-muted">
                        {{ k.stock_anterior }}
                    </td>

                    <td class="text-end fw-bold">
                        {{ k.stock_nuevo }}
                    </td>

                </tr>

                <tr *ngIf="!data.length">
                    <td colspan="5" class="text-center empty-state">
                        Sin movimientos registrados
                    </td>
                </tr>

            </tbody>

        </table>

    </div>
    <!-- FOOTER -->
    <div class="d-flex justify-content-end mt-3">
        <button class="btn btn-secondary" (click)="close.emit()">
            Cerrar
        </button>
    </div>

</app-modal>
