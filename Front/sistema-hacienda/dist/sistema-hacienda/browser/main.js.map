<!-- Page header starts -->
<div class="page-header">
  <div class="breadcrumb">
    <li class="breadcrumb-item breadcrumb-active" >
      <i class="bi bi-house"></i>
      <a routerLink="/dashboard">Home > </a>
    </li>
  </div>
  <ol class="breadcrumb " *ngIf="breadcrumbs.length > 0">
    <li class="breadcrumb-item breadcrumb-active" *ngFor="let breadcrumb of breadcrumbs; let last = last">
      <ng-container *ngIf="!last">
        <a [routerLink]="breadcrumb.url">{{ breadcrumb.label }}</a>
      </ng-container>
      <ng-container *ngIf="last">
        {{ breadcrumb.label }}
      </ng-container>
    </li>
  </ol>

  <!-- Header actions ccontainer start -->
  <div class="header-actions-container">

    <!-- Search container start -->
    <div class="search-container">
    </div>
    <!-- Header actions ccontainer start -->
    <div class="header-actions-container">
      <ul class="header-actions">
        <p class="fw-bolder text-center text-primary-emphasis"> Bienvenido: </p>
        <li class="dropdown">
          <a href="#" id="userSettings" class="user-settings" data-toggle="dropdown" aria-haspopup="true">
            <span class="user-name d-none d-md-block">{{username}}</span>
            <span class="avatar">
              <img src="assets/images/SistemaHac/Logo/user.svg" alt="Admin ">
              <span class="status online"></span>
            </span>
          </a>
          <div class="dropdown-menu dropdown-menu-end" aria-labelledby="userSettings">
            <div class="header-profile-actions">
              <a href="profile.html">Profile</a>
              <a href="account-settings.html">Settings</a>
              <a (click)="logout()">Logout</a>
            </div>
          </div>
        </li>
      </ul>
      <!-- Header actions end -->

    </div>
    <!-- Header actions ccontainer end -->
  </div>
  <!-- Header actions ccontainer end -->
</div>
<!-- Page header ends -->
