<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <div class="row">

        <!-- 🔍 Búsqueda -->
       <!-- <div class="col-12 mb-3">
          <label class="form-label">Buscar Usuario</label>
          <div class="input-group">
            <input type="text" class="form-control" [(ngModel)]="searchTerm" placeholder="Nombre o Apellido" (keyup.enter)="buscarUsuario()">
            <button class="btn btn btn-primary" (click)="buscarUsuario()">Buscar</button>
            <button class="btn btn-secondary" (click)="buscarOtrosEmpleados()">Buscar Otros Empleados</button>
          </div>
        </div>-->
        <input
          type="text"
          class="form-control"
          placeholder="Buscar empleado"
          [(ngModel)]="searchTerm"
          (keyup.enter)="buscarUsuario()"
        />

        <ul
          class="list-group mt-2"
          *ngIf="usuariosEncontrados.length > 0"
        >
          <li
            class="list-group-item list-group-item-action"
            *ngFor="let user of usuariosEncontrados"
            (click)="seleccionarUsuario(user)"
          >
            {{ user.NOMBRE_1 }} {{ user.APELLIDO_1 }} - {{ user.NUM_CEDULA }}
          </li>
        </ul>



        <!-- Campos -->
        <div class="col-sm-6">
          <label>Nombre *</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.NOMBRE_1" (input)="generarNombreUsuario()" readonly>
        </div>
        <div class="col-sm-6">
          <label>Apellido *</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.APELLIDO_1" (input)="generarNombreUsuario()" readonly>
        </div>

        <div class="col-sm-6">
          <label>Cédula</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.NUM_CEDULA" (input)="generarPassword()" >
        </div>

        <div class="col-sm-6">
          <label>Empresa *</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.EMPRESA"readonly>
        </div>

        <div class="col-sm-6">
          <label>Email *</label>
          <input type="email" class="form-control" [(ngModel)]="usuario.EMAIL" placeholder="ejemplo@empresa.com" required>
        </div>

        <!-- 👤 Nombre de usuario generado -->
        <div class="col-sm-6">
          <label>Nombre de Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="usernameGenerado" readonly>
        </div>
        <!-- Campos de grupo y rol -->
        <div class="col-sm-6 mt-3">
          <label>Grupo *</label>
          <select class="form-select" [(ngModel)]="usuario.idGrupo" required>
            <option value="">-- Seleccione un grupo --</option>
            <option *ngFor="let grupo of grupos" [value]="grupo.id">{{ grupo.grupo }}</option>
          </select>
        </div>

        <div class="col-sm-6 mt-3">
          <label>Rol *</label>
          <select class="form-select" [(ngModel)]="usuario.idRol" required>
            <option value="">-- Seleccione un rol --</option>
            <option *ngFor="let rol of roles" [value]="rol.id">{{ rol.nombre }}</option>
          </select>
        </div>

        <!-- 🔐 Contraseña generada automáticamente -->
        <div class="col-sm-6 mt-3">
          <label>Password (generado automáticamente)</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.password" readonly>
        </div>

        <div class="col-12 mt-4">
          <button class="btn btn-info" (click)="guardarUsuario()">Guardar Usuario</button>
        </div>
      </div>
    </div>
  </div>
</div>
