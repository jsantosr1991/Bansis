<div class="container-fluid mt-4">
  <div class="container">
  <h3>Gestión de Privilegios Temporales</h3>
  <div class="card mb-4 p-3">

    <form (ngSubmit)="otorgar()">
      <div class="row g-2">
        <div class="col-md-3">
          <label class="fw-bold">De:</label>
          <select class="form-control" [(ngModel)]="nuevoPrivilegio.otorgado_por" name="rol_delegado_id" required>
            <option value="" disabled selected>Selecciona Usuario</option>
            <option *ngFor="let u of usuarios" [value]="u.id">{{ u.NOMBRE_CORTO }}</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="fw-bold">A :</label>
          <select class="form-control" [(ngModel)]="nuevoPrivilegio.usuario_id" name="usuario_id" required>
            <option value="" disabled selected>Selecciona un usuario</option>
            <option *ngFor="let u of usuarios" [value]="u.id">{{ u.NOMBRE_CORTO }}</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="fw-bold">Seleccionar Rol:</label>
          <select class="form-control" [(ngModel)]="nuevoPrivilegio.rol_delegado_id" name="rol_delegado_id" required>
            <option value="" disabled selected>Selecciona un rol</option>
            <option *ngFor="let r of roles" [value]="r.id">{{ r.nombre }}</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="fw-bold">Fecha Inicio:</label>
          <input class="form-control" type="date" [(ngModel)]="nuevoPrivilegio.fecha_inicio" name="fecha_inicio" [min]="minDate" required>
        </div>
        <div class="col-md-2">
          <label class="fw-bold">Fecha Fin:</label>
          <input class="form-control" type="date" [(ngModel)]="nuevoPrivilegio.fecha_fin" [min]="minDate" name="fecha_fin" required>
        </div>
      </div>
      <div class="mt-3 text-end">
        <button class="btn btn-primary">Otorgar privilegio</button>
      </div>
    </form>
  </div>
</div>



<div class="container">
  <div class="table-responsive">
    <table class="table table-striped table-bordered table-hover table-sm align-middle">
      <thead class="table-primary text-center">
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Rol delegado</th>
        <th>Otorgado por</th>
        <th>Inicio</th>
        <th>Fin</th>
        <th>Activo</th>
        <th>Acción</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let p of privilegios|paginate: {itemsPerPage:5, currentPage:page} " [class.table-success]="p.activo == 1" [class.table-secondary]="p.activo == 0">
        <td class="text-center">{{ p.idSerial }}</td>
        <td>{{ p.usuario }}</td>
        <td>{{ p.rol_delegado }}</td>
        <td>{{ p.otorgado_por }}</td>
        <td class="text-center">{{ p.fecha_inicio | date:'dd-MM-yyyy' }}</td>
        <td class="text-center">{{ p.fecha_fin | date:'dd-MM-yyyy' }}</td>
        <td class="text-center">
          <span [class.text-success]="p.activo == 1" [class.text-danger]="p.activo == 0" class="fw-bold">
            {{ p.activo ? 'Sí' : 'No' }}
          </span>
        </td>
        <td class="text-center">
          <button *ngIf="p.activo" class="btn btn-sm btn-danger" (click)="desactivar(p.idSerial)">
            <i class="bi bi-x-circle"></i> Desactivar
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

</div>
